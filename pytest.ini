[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=queries
    --cov=procedures
    --cov-report=term-missing
    --cov-report=html:htmlcov
markers =
    slow: marca testes lentos (deselect com '-m "not slow"')
    integration: marca testes de integracao
    sql: marca testes que executam queries SQL reais
